apiVersion: apps/v1
kind: Deployment
metadata: {name: demo, namespace: default}
spec:
  selector: {matchLabels: {app: demo}}
  template:
    metadata: {labels: {app: demo}}
    spec:
      initContainers:
        - name: setup
          image: busybox:1.36
          securityContext: {privileged: {{ .Values.initPrivileged }}}
      containers:
        - name: app
          image: nginx:1.27
          securityContext: {privileged: false}
