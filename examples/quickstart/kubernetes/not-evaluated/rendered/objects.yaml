apiVersion: v1
kind: Service
metadata:
  name: web-metrics
  namespace: demo
spec:
  selector:
    app: web
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo
spec:
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: example.invalid/web:1
          ports:
            - name: other
              containerPort: 8080
              protocol: TCP
