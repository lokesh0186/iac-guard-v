---
# Source: dgraph/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: adjudicate-dgraph
  namespace: dgraph-system
  labels:
    app: dgraph
    app.kubernetes.io/instance: adjudicate
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: dgraph
    app.kubernetes.io/version: v25.3.1
    chart: dgraph-25.3.1-preview2
    helm.sh/chart: dgraph-25.3.1-preview2
    heritage: Helm
    release: adjudicate
spec:
  podSelector:
    matchLabels:
      app: dgraph
      release: adjudicate
  policyTypes:
    - Ingress
  ingress:
    # Intra-cluster: any dgraph pod from this release may reach any other.
    - from:
        - podSelector:
            matchLabels:
              app: dgraph
              release: adjudicate

