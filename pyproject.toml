[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "iac-guard-v"
version = "0.1.0a1"
description = "Differential verification for infrastructure-as-code changes: did the fix actually fix it?"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Lokesh Chauhan" }]
keywords = ["infrastructure-as-code", "terraform", "kubernetes", "verification", "devsecops"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
# Parser dependencies are part of the independent IaC evidence boundary.  No
# model-provider SDK is present; the core remains model-agnostic and offline-capable.
dependencies = [
  "PyYAML>=6.0.2,<7",
  "python-hcl2>=7.3,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.urls]
Homepage = "https://github.com/lokesh0186/iac-guard-v"
Repository = "https://github.com/lokesh0186/iac-guard-v"

[tool.hatch.build.targets.wheel]
packages = ["src/iac_guard_v"]

# Research data, the paper, and experiment outputs must never enter a distribution.
[tool.hatch.build.targets.sdist]
include = ["src/iac_guard_v", "README.md", "LICENSE", "pyproject.toml"]
exclude = ["benchmark/", "runs/", "results/", "scanners/", "prompts/", "research/",
           "paper.pdf", "tests/", "docs/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/iac_guard_v"]
