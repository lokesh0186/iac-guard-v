name: Checkov compatibility qualification

on:
  pull_request:
    paths:
      - 'src/iac_guard_v/**'
      - 'tools/compatibility/**'
      - '.github/workflows/checkov-compatibility.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

jobs:
  release-required-matrix:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Explicit set, never a floating version-range promotion.
        checkov: ['3.3.0', '3.3.1', '3.3.2', '3.3.3', '3.3.4', '3.3.5',
                  '3.3.6', '3.3.7', '3.3.8', '3.3.9', '3.3.10', '3.3.11',
                  '3.3.12', '3.3.13', '3.3.14', '3.3.15', '3.3.16', '3.3.17',
                  '3.3.18', '3.3.19', '3.3.20', '3.3.21', '3.3.22', '3.3.23',
                  '3.3.24', '3.3.25', '3.3.26', '3.3.27', '3.3.28', '3.3.29', '3.3.30']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install one ordinary Checkov distribution
        run: python -m pip install 'checkov==${{ matrix.checkov }}'
      - name: Prepare separate product with shared scanner visibility
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python tools/compatibility/prepare_shared.py --venv "$RUNNER_TEMP/iacgv-product" --checkov "$(command -v checkov)" --launcher-dir "$RUNNER_TEMP/iacgv-scanner"
      - name: Qualify execution, imports, policies, adapter and repair controls
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          "$RUNNER_TEMP/iacgv-product/bin/python" tools/compatibility/qualify.py --ordinary "$(command -v checkov)" --controlled "$RUNNER_TEMP/iacgv-scanner/checkov" --output "$RUNNER_TEMP/qualification"

      - name: Qualify the security-group description policy
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          "$RUNNER_TEMP/iacgv-product/bin/python" tools/compatibility/qualify_description.py --controlled "$RUNNER_TEMP/iacgv-scanner/checkov" --output "$RUNNER_TEMP/qualification/description-supplement"
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checkov-${{ matrix.checkov }}-qualification
          path: ${{ runner.temp }}/qualification
          if-no-files-found: warn

  latest-canary:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Failure is visible and requires review; this job never edits the profile.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install latest Checkov once
        run: python -m pip install checkov
      - name: Prepare canary environment
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python tools/compatibility/prepare_shared.py --venv "$RUNNER_TEMP/iacgv-product" --checkov "$(command -v checkov)" --launcher-dir "$RUNNER_TEMP/iacgv-scanner"
      - name: Observe compatibility without promoting support
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          "$RUNNER_TEMP/iacgv-product/bin/python" tools/compatibility/qualify.py --ordinary "$(command -v checkov)" --controlled "$RUNNER_TEMP/iacgv-scanner/checkov" --output "$RUNNER_TEMP/canary"
      - name: Qualify canary description policy
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          "$RUNNER_TEMP/iacgv-product/bin/python" tools/compatibility/qualify_description.py --controlled "$RUNNER_TEMP/iacgv-scanner/checkov" --output "$RUNNER_TEMP/canary/description-supplement"
      - name: Retain canary evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checkov-latest-canary
          path: ${{ runner.temp }}/canary
          if-no-files-found: warn
