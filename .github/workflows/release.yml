name: Publish reviewed PyPI artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-pypi-0.1.0a3
  cancel-in-progress: false

jobs:
  publish-pypi:
    name: Publish 0.1.0a3 to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/iac-guard-v
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download and verify the reviewed GitHub Release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.1.0-alpha.3
          RELEASE_COMMIT: 874e5316eb822ed5726605b84f66b7a96120dc21
          WHEEL_SHA256: 7de633ff85595052c04a9fad2aa156a2e3f77062ba7d118f5a35fb15fd08405b
          SDIST_SHA256: a0aa406752013cc574e4d40ba23826ec472eb28db0a751af06f5196b839d33cf
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "lokesh0186/iac-guard-v"
          test "$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json targetCommitish --jq .targetCommitish)" = "${RELEASE_COMMIT}"
          mkdir dist
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir dist \
            --pattern 'iac_guard_v-0.1.0a3-py3-none-any.whl' \
            --pattern 'iac_guard_v-0.1.0a3.tar.gz'
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 2
          printf '%s  %s\n' \
            "${WHEEL_SHA256}" 'dist/iac_guard_v-0.1.0a3-py3-none-any.whl' \
            "${SDIST_SHA256}" 'dist/iac_guard_v-0.1.0a3.tar.gz' \
            | sha256sum --check --strict -

      - name: Publish the byte-identical artifacts with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1, reviewed 2026-08-20
        with:
          packages-dir: dist/
          print-hash: true
