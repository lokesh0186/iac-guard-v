name: Publish reviewed PyPI artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-pypi-0.1.0a2
  cancel-in-progress: false

jobs:
  publish-pypi:
    name: Publish 0.1.0a2 to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/iac-guard-v
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download and verify the reviewed GitHub Release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.1.0-alpha.2
          RELEASE_COMMIT: 520bc60067e0d7e458fcd0bbc9cb09ea9f487e06
          WHEEL_SHA256: f97c474cfeb767ffa3dcec515f940553d95fd646829f77bf26ebe2cd102b35c9
          SDIST_SHA256: ba2b10267cc03c5d0e394476a334d35a1dd3328d3b095594178f1220bb6935e7
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "lokesh0186/iac-guard-v"
          test "$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json targetCommitish --jq .targetCommitish)" = "${RELEASE_COMMIT}"
          mkdir dist
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir dist \
            --pattern 'iac_guard_v-0.1.0a2-py3-none-any.whl' \
            --pattern 'iac_guard_v-0.1.0a2.tar.gz'
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 2
          printf '%s  %s\n' \
            "${WHEEL_SHA256}" 'dist/iac_guard_v-0.1.0a2-py3-none-any.whl' \
            "${SDIST_SHA256}" 'dist/iac_guard_v-0.1.0a2.tar.gz' \
            | sha256sum --check --strict -

      - name: Publish the byte-identical artifacts with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1, reviewed 2026-08-20
        with:
          packages-dir: dist/
          print-hash: true
