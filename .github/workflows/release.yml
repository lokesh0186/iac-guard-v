name: Publish reviewed PyPI artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-pypi-0.1.0a9
  cancel-in-progress: false

jobs:
  publish-pypi:
    name: Publish 0.1.0a9 to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/iac-guard-v
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download and verify the reviewed GitHub Release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.1.0-alpha.9
          RELEASE_COMMIT: b4045c1e25e1abb10d55912698ea7130f13d54db
          WHEEL_SHA256: 64727745b787fdb473712eed1c4cd332ee27b12553ab3edc34194045f637ee00
          SDIST_SHA256: c13c20886cf86ab6f86b98b0d3c7de6a3995c12536ef31633cb45029207a8d2e
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "lokesh0186/iac-guard-v"
          test "$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json targetCommitish --jq .targetCommitish)" = "${RELEASE_COMMIT}"
          mkdir dist
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir dist \
            --pattern 'iac_guard_v-0.1.0a9-py3-none-any.whl' \
            --pattern 'iac_guard_v-0.1.0a9.tar.gz'
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 2
          printf '%s  %s\n' \
            "${WHEEL_SHA256}" 'dist/iac_guard_v-0.1.0a9-py3-none-any.whl' \
            "${SDIST_SHA256}" 'dist/iac_guard_v-0.1.0a9.tar.gz' \
            | sha256sum --check --strict -

      - name: Publish the byte-identical artifacts with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1, reviewed 2026-08-20
        with:
          packages-dir: dist/
          print-hash: true
