name: Publish reviewed PyPI artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-pypi-0.1.0a10
  cancel-in-progress: false

jobs:
  publish-pypi:
    name: Publish 0.1.0a10 to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/iac-guard-v
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download and verify the reviewed GitHub Release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.1.0-alpha.10
          RELEASE_COMMIT: 038bf38256706ffc83485bf5f33eb3c4992e3857
          WHEEL_SHA256: 6ff89229083c88b3d9c35b9be21646e722dfccaf2e6b2ccf3d215bb4c2a3b57e
          SDIST_SHA256: 0df0104985e202c176d3f66cd1231334b03585c72b6870dc5db3379c3b932b47
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "lokesh0186/iac-guard-v"
          test "$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json targetCommitish --jq .targetCommitish)" = "${RELEASE_COMMIT}"
          mkdir dist
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir dist \
            --pattern 'iac_guard_v-0.1.0a10-py3-none-any.whl' \
            --pattern 'iac_guard_v-0.1.0a10.tar.gz'
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 2
          printf '%s  %s\n' \
            "${WHEEL_SHA256}" 'dist/iac_guard_v-0.1.0a10-py3-none-any.whl' \
            "${SDIST_SHA256}" 'dist/iac_guard_v-0.1.0a10.tar.gz' \
            | sha256sum --check --strict -

      - name: Publish the byte-identical artifacts with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1, reviewed 2026-08-20
        with:
          packages-dir: dist/
          print-hash: true
