name: Publish reviewed PyPI artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-pypi-0.1.0a4
  cancel-in-progress: false

jobs:
  publish-pypi:
    name: Publish 0.1.0a4 to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/iac-guard-v
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download and verify the reviewed GitHub Release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.1.0-alpha.4
          RELEASE_COMMIT: 86cb20f599b0b77fd44b0e8df15440dd437749ab
          WHEEL_SHA256: 6a96b1c45098e0ac96c2c7b16bb2b6c9863f0f8c6e2b6da3eaffcc00138bf537
          SDIST_SHA256: 78074faf75de2914110fecc99a094c6bfe545d4116401b581bf53273561561c9
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "lokesh0186/iac-guard-v"
          test "$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json targetCommitish --jq .targetCommitish)" = "${RELEASE_COMMIT}"
          mkdir dist
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir dist \
            --pattern 'iac_guard_v-0.1.0a4-py3-none-any.whl' \
            --pattern 'iac_guard_v-0.1.0a4.tar.gz'
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 2
          printf '%s  %s\n' \
            "${WHEEL_SHA256}" 'dist/iac_guard_v-0.1.0a4-py3-none-any.whl' \
            "${SDIST_SHA256}" 'dist/iac_guard_v-0.1.0a4.tar.gz' \
            | sha256sum --check --strict -

      - name: Publish the byte-identical artifacts with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1, reviewed 2026-08-20
        with:
          packages-dir: dist/
          print-hash: true
