name: Python compatibility

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  warnings-as-errors:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test runner
        run: |
          python -m venv --copies /tmp/iacgv-compat
          python -m pip --python /tmp/iacgv-compat/bin/python install --no-compile -e ".[compat-test]"
      - name: Establish local-only research freeze tag
        run: python tools/ensure_ci_freeze_tag.py
      - name: Clean-bytecode import
        run: PYTHONPATH=src /tmp/iacgv-compat/bin/python -W error -c "import iac_guard_v"
      - name: Run tests
        run: PYTHONPATH=src /tmp/iacgv-compat/bin/python -m pytest tests --ignore=tests/integration -q
      - name: Enforce D3 core coverage
        run: |
          PYTHONPATH=src /tmp/iacgv-compat/bin/python -m pytest tests/unit/test_fingerprints.py tests/unit/test_matching.py tests/unit/test_matching_d32.py tests/unit/test_diffing.py --cov=iac_guard_v.fingerprints --cov-report=term-missing --cov-fail-under=90 -q
          PYTHONPATH=src /tmp/iacgv-compat/bin/python -m pytest tests/unit/test_fingerprints.py tests/unit/test_matching.py tests/unit/test_matching_d32.py tests/unit/test_diffing.py --cov=iac_guard_v.matching --cov-report=term-missing --cov-fail-under=90 -q
          PYTHONPATH=src /tmp/iacgv-compat/bin/python -m pytest tests/unit/test_fingerprints.py tests/unit/test_matching.py tests/unit/test_matching_d32.py tests/unit/test_diffing.py --cov=iac_guard_v.diffing --cov-report=term-missing --cov-fail-under=90 -q
      - name: Enforce D4 adapter coverage
        run: |
          PYTHONPATH=src /tmp/iacgv-compat/bin/python -m pytest tests/unit/test_adapter_base.py tests/unit/test_checkov_adapter.py tests/unit/test_checkov_adapter_d41.py tests/unit/test_checkov_adapter_d42.py tests/unit/test_checkov_adapter_d45.py tests/unit/test_checkov_adapter_d46.py tests/unit/test_checkov_adapter_d48.py tests/unit/test_engine_d47.py tests/unit/test_graph_evidence_a2.py tests/unit/test_terraform_coverage_contract_a3.py --cov=iac_guard_v.adapters.base --cov=iac_guard_v.adapters.checkov --cov=iac_guard_v.graph_evidence --cov=iac_guard_v.terraform_parser --cov-branch --cov-report=term-missing --cov-fail-under=90 -q
      - name: Enforce D5 engine coverage
        run: |
          PYTHONPATH=src /tmp/iacgv-compat/bin/python -m pytest tests/unit/test_engine.py tests/unit/test_engine_coverage_ci.py tests/unit/test_engine_d44.py tests/unit/test_engine_d45.py tests/unit/test_engine_d47.py tests/unit/test_engine_d51.py tests/unit/test_engine_d52.py tests/unit/test_engine_d53.py tests/unit/test_engine_d54.py tests/unit/test_engine_d55.py tests/unit/test_engine_d56.py tests/unit/test_engine_d57.py tests/unit/test_public_d7.py tests/unit/test_terraform_coverage_contract_a3.py --cov=iac_guard_v.engine --cov-branch --cov-report=term-missing --cov-fail-under=90 -q
      - name: Enforce D6 policy coverage
        run: |
          PYTHONPATH=src /tmp/iacgv-compat/bin/python -m pytest tests/unit/test_policy.py tests/unit/test_policy_d61.py tests/unit/test_policy_d62.py tests/unit/test_policy_d63.py tests/unit/test_policy_d64.py tests/unit/test_engine_d51.py --cov=iac_guard_v.policy --cov-branch --cov-report=term-missing --cov-fail-under=90 -q
      - name: Enforce D7 public-boundary coverage
        run: |
          PYTHONPATH=src /tmp/iacgv-compat/bin/python -m pytest tests/unit/test_api_adoption.py tests/unit/test_candidate_acceptance_a5.py tests/unit/test_candidate_addressability_a5.py tests/unit/test_cli_adoption_branches.py tests/unit/test_cli_ux1.py tests/unit/test_cli_ux2.py tests/unit/test_cli_ux3.py tests/unit/test_public_d7.py tests/unit/test_public_d71.py tests/unit/test_public_d72.py tests/unit/test_public_d73.py tests/unit/test_public_d74.py tests/unit/test_public_d75.py tests/unit/test_reporters_e61.py tests/unit/test_workflow_adoption_branches.py tests/unit/test_workflow_commands_e62.py tests/unit/test_terraform_coverage_contract_a3.py tests/unit/test_helm_materialization_a4.py tests/unit/test_helm_public_a4.py --cov=iac_guard_v.acceptance --cov=iac_guard_v.api --cov=iac_guard_v.cli --cov=iac_guard_v.config --cov=iac_guard_v.report --cov-branch --cov-report=term-missing --cov-fail-under=90 -q
      - name: Enforce a4 Helm materializer coverage
        run: |
          PYTHONPATH=src /tmp/iacgv-compat/bin/python -m pytest tests/unit/test_candidate_acceptance_a5.py tests/unit/test_helm_materialization_a4.py tests/unit/test_helm_public_a4.py --cov=iac_guard_v.helm --cov-branch --cov-report=term-missing --cov-fail-under=90 -q

  pinned-checkov-330:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install pinned product scanner in copied-file environment
        run: |
          python -m venv --copies /tmp/iacgv-checkov330
          /tmp/iacgv-checkov330/bin/python -m pip install --no-compile "checkov==3.3.0" "pytest>=8,<10" "build>=1.2,<2"
      - name: Establish local-only research freeze tag
        run: python tools/ensure_ci_freeze_tag.py
      - name: Run pinned Checkov integration contracts
        run: |
          find /tmp/iacgv-checkov330 -name __pycache__ -type d -prune -exec rm -rf {} +
          find /tmp/iacgv-checkov330 -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          PYTHONDONTWRITEBYTECODE=1 PATH=/tmp/iacgv-checkov330/bin:/usr/bin:/bin PYTHONPATH=src /tmp/iacgv-checkov330/bin/python -m pytest tests/integration/test_checkov_integration.py -q
      - name: Run installed-wheel golden alpha workflow
        run: |
          PYTHONDONTWRITEBYTECODE=1 PATH=/tmp/iacgv-checkov330/bin:/usr/bin:/bin PYTHONPATH=src /tmp/iacgv-checkov330/bin/python -m pytest tests/integration/test_alpha_golden_quickstart.py -q
