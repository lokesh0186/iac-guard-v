name: Python compatibility

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  warnings-as-errors:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test runner
        run: python -m pip install -e ".[compat-test]"
      - name: Clean-bytecode import
        run: |
          find src -name __pycache__ -type d -prune -exec rm -rf {} +
          PYTHONPATH=src python -W error -c "import iac_guard_v"
      - name: Run tests
        run: PYTHONPATH=src python -m pytest tests --ignore=tests/integration -q
      - name: Enforce D3 core coverage
        run: |
          PYTHONPATH=src python -m pytest tests/unit/test_fingerprints.py tests/unit/test_matching.py tests/unit/test_matching_d32.py tests/unit/test_diffing.py --cov=iac_guard_v.fingerprints --cov-report=term-missing --cov-fail-under=90 -q
          PYTHONPATH=src python -m pytest tests/unit/test_fingerprints.py tests/unit/test_matching.py tests/unit/test_matching_d32.py tests/unit/test_diffing.py --cov=iac_guard_v.matching --cov-report=term-missing --cov-fail-under=90 -q
          PYTHONPATH=src python -m pytest tests/unit/test_fingerprints.py tests/unit/test_matching.py tests/unit/test_matching_d32.py tests/unit/test_diffing.py --cov=iac_guard_v.diffing --cov-report=term-missing --cov-fail-under=90 -q
      - name: Enforce D4 adapter coverage
        run: |
          PYTHONPATH=src python -m pytest tests/unit/test_checkov_adapter.py tests/unit/test_checkov_adapter_d41.py tests/unit/test_checkov_adapter_d42.py tests/unit/test_checkov_adapter_d45.py tests/unit/test_checkov_adapter_d46.py tests/unit/test_engine_d47.py --cov=iac_guard_v.adapters.base --cov=iac_guard_v.adapters.checkov --cov-branch --cov-report=term-missing --cov-fail-under=90 -q
      - name: Enforce D5 engine coverage
        run: |
          PYTHONPATH=src python -m pytest tests/unit/test_engine.py tests/unit/test_engine_d44.py tests/unit/test_engine_d45.py tests/unit/test_engine_d47.py tests/unit/test_engine_d51.py tests/unit/test_engine_d52.py tests/unit/test_engine_d53.py tests/unit/test_engine_d54.py tests/unit/test_engine_d55.py tests/unit/test_public_d7.py --cov=iac_guard_v.engine --cov-branch --cov-report=term-missing --cov-fail-under=90 -q
      - name: Enforce D6 policy coverage
        run: |
          PYTHONPATH=src python -m pytest tests/unit/test_policy.py tests/unit/test_policy_d61.py tests/unit/test_policy_d62.py tests/unit/test_policy_d63.py tests/unit/test_policy_d64.py tests/unit/test_engine_d51.py --cov=iac_guard_v.policy --cov-branch --cov-report=term-missing --cov-fail-under=90 -q

  pinned-checkov-330:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned product scanner and test runner
        run: python -m pip install "checkov==3.3.0" "pytest>=8,<10"
      - name: Run pinned Checkov integration contracts
        run: PYTHONPATH=src python -m pytest tests/integration/test_checkov_integration.py -q
