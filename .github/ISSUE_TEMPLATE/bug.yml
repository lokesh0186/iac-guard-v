name: Bug report
description: Report reproducible IaC-Guard-V behavior without private infrastructure.
title: "Bug: "
labels: [bug]
body:
  - type: input
    id: version
    attributes: {label: IaC-Guard-V version}
    validations: {required: true}
  - type: textarea
    id: reproduction
    attributes: {label: Minimal public reproduction}
    validations: {required: true}
  - type: textarea
    id: result
    attributes: {label: Observed and expected result}
    validations: {required: true}
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: I removed credentials, private paths, and undisclosed third-party evidence.
          required: true
